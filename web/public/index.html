<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E0E10" />
    <meta
      name="description"
      content="Wyvern Drive — private cloud storage backed by Discord"
    />
    <title>Wyvern Drive</title>
  </head>
  <body>
    <!--
      wyvern-drive · direction contract v1
      THESIS: A personal cloud drive backed by Discord, dressed in Framer's
      dark-canvas marketing world. Near-black canvas everywhere, white pill
      CTAs, binary ink/ink-muted hierarchy, one accent (blue) reserved for
      links, focus and selection, and exactly one gradient spotlight card —
      the drive's empty state — as the system's only chromatic atmosphere.
      The category default it refuses: the light Google-Drive chrome
      (blurple accents, white cards, 8px radius) cloud drives usually ship.
      OWN-WORLD: Mona Sans Variable display (500, hard negative tracking,
      -3.1px at 62px, -1.0px at 32px), Inter Variable body with OpenType
      variants cv01/cv05/cv09/cv11/ss03/ss07/dlig, 5px spacing base,
      pill / 20px / 30px radius scale, surface lift (canvas → surface-1 →
      surface-2) instead of color to mark hierarchy, light-edge elevation,
      cloud-drive side rail, monochrome file-type glyphs.
      CROSS-SURFACE: login and share pages carry the poster voice; the drive
      stays Operate-first — scanability, density and native affordances
      outrank expression; the gradient is scarce by design.
      -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div
      id="root"
      data-wyvern-thesis="A personal cloud drive backed by Discord, dressed in Framer's dark-canvas world: near-black canvas everywhere, white pill CTAs, binary ink/ink-muted hierarchy, accent blue reserved for links/focus/selection, one violet gradient spotlight card (the drive empty state) as the only chromatic atmosphere. Refuses the light Google-Drive chrome."
      data-wyvern-world="Mona Sans Variable display at 500 with hard negative tracking (-3.1px at 62px, -1.0px at 32px); Inter Variable body with OpenType variants cv01/cv05/cv09/cv11/ss03/ss07/dlig; 5px spacing base; pill/20px/30px radius scale; hierarchy by surface lift canvas->surface1->surface2; light-edge elevation; cloud-drive side rail; monochrome file-type glyphs."
    ></div>
  </body>
</html>
