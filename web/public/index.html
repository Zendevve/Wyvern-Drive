  <body>
    <!--
      wyvern-drive · direction contract v3
      THESIS: The Dark Canvas — Wyvern Drive wears Framer's dark-canvas
      world: a near-black canvas, oversized white display type with hard
      negative tracking, and one chromatic accent (blue) that is reserved
      for links, focus, and selection — never a fill. The category default
      it refuses: the light Google-Drive chrome of every other file manager.
      OWN-WORLD: canvas #0E0E10 with surface-lift steps #1A1A1D / #242428;
      binary ink #FFFFFF / ink-muted #999999; accent blue #0099FF for links,
      focus, selection, and the drop-target ring only; one violet gradient
      spotlight card (the drive empty state) as the system's only atmosphere;
      Mona Sans Variable 500 display (62px/-3.1px hero), Inter Variable body
      with OpenType variants cv01 cv05 cv09 cv11 ss03 ss07 dlig; 5px spacing
      base; pills (100px) for every CTA, circles for icon actions; light-edge
      elevation; dark-only — no light mode, no glass, no glow.
      STORY: the app is a poster at the edges — /login and /share speak in
      poster voice on the dark canvas — and a quiet instrument in the middle:
      /drive is Operate-first, scanable and dense, familiar cloud-drive idioms
      outranking expression. The one gradient moment — the violet spotlight
      empty state — is the memorable moment.
      FIRST VIEWPORT: every route shows the task and the primary action
      immediately; the 62px login hero lands the tagline on first paint.
      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
      -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div
      id="root"
      data-wyvern-thesis="The Dark Canvas — Wyvern Drive wears Framer's dark-canvas world: near-black canvas, oversized white display type with hard negative tracking, one chromatic accent (blue) reserved for links, focus, and selection — never a fill. Refuses the light Google-Drive chrome."
      data-wyvern-world="canvas #0E0E10 with surface-lift steps #1A1A1D/#242428; binary ink #FFFFFF / ink-muted #999999; accent blue #0099FF for links/focus/selection/drop-target only; one violet gradient spotlight card (drive empty state) as the only atmosphere; Mona Sans Variable 500 display (62px/-3.1px hero), Inter Variable body with OpenType variants cv01 cv05 cv09 cv11 ss03 ss07 dlig; 5px spacing; pills for every CTA, circles for icon actions; light-edge elevation; dark-only."
      data-wyvern-story="Poster at the edges (/login, /share), quiet instrument in the middle (/drive Operate-first); the violet spotlight empty state is the memorable moment."
      data-wyvern-first-viewport="Every route shows the task and the primary action immediately; the 62px login hero lands the tagline on first paint."
