<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0E10" />
    <meta
      name="description"
      content="Wyvern Drive — private cloud storage backed by Discord"
    />
    <title>Wyvern Drive</title>
  </head>
  <body>
    <!--
      wyvern-drive · direction contract v2
      THESIS: Signal Deck — a split-flap operations board for a private file
      system whose encrypted payloads move through Discord attachments. The
      UI is a trustworthy live manifest that makes storage state legible.
      The category default it refuses: the centered SaaS dashboard of equal
      cards — identity lives in the shell, the ruled rows, the state changes,
      and the task hierarchy, not uniform tiles.
      WORLD: matte graphite canvas (#0A0E10) with measured surface steps
      (#11181B / #1A2428 / #233036); warm white ink (#F4F1E8) and muted steel
      text (#9BA7A7); one amber signal (#D9A441) for primary actions,
      selection, focus and drop targets — every other color is semantic,
      never decorative; local mono stack reserved for measurement (IDs,
      sizes, dates, status, byte values); fixed-grid instrument grammar —
      ruled headers, fixed character cells, status lamps, restrained steel
      inset edges; 5px spacing base; radius by role (panels 12px, cells 6px,
      controls/icon actions 8px); rectangular controls only — no pill-button
      system, no gradients, no glass, no glow.
      CROSS-SURFACE: /login is the boot screen, /drive the live file
      manifest, /settings the storage control room, /trash the recovery
      ledger, /setup and /connect guided check-ins, /share/:token a
      recipient transfer manifest. Split-flap state changes (140–220ms,
      one-character flips) replace choreographed page-load motion.
      FIRST-VIEWPORT: every route shows the task and the primary action
      immediately.
      -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div
      id="root"
      data-wyvern-thesis="Signal Deck: a split-flap operations board for a private file system whose encrypted payloads move through Discord attachments — a trustworthy live manifest that makes storage state legible. Refuses the centered SaaS dashboard of equal cards; identity lives in the shell, ruled rows, state changes, and task hierarchy."
      data-wyvern-world="Matte graphite canvas #0A0E10 with measured surface steps #11181B/#1A2428/#233036; warm white ink #F4F1E8 and muted steel #9BA7A7; one amber signal #D9A441 for actions/selection/focus/drop targets, other colors semantic only; local mono stack for measurement (IDs, sizes, dates, status, bytes); fixed-grid grammar of ruled headers, character cells, status lamps, steel inset edges; 5px spacing; radius by role 12/6/8/8; rectangular controls only — no pills, no gradients, no glass, no glow."
      data-wyvern-story="/login boot screen, /drive live file manifest, /settings storage control room, /trash recovery ledger, /setup and /connect guided check-ins, /share/:token recipient transfer manifest; split-flap state changes (140-220ms, one-character flips) replace choreographed page-load motion."
      data-wyvern-first-viewport="Every route shows the task and the primary action immediately in the first viewport."
    ></div>
  </body>
</html>
