# Netlify Build Configuration

[build]
  base = "wyvern-web"
  command = "npm run build"
  publish = "dist"

# Edge Functions - OG meta tags for share links
[[edge_functions]]
  path = "/share/*"
  function = "og-share"

# SPA routing - redirect all routes to index.html
# Note: Edge function runs BEFORE this redirect for /share/* paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables will be set in Netlify dashboard
# VITE_API_URL = https://lrqnovltirjsoqfvtxxu.supabase.co/functions/v1/api

[build.environment]
  NODE_VERSION = "20"

